<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Antigravity - Smart Atlas Viewer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 20px;
            height: 85vh;
        }

        #canvas-container {
            position: relative;
            border: 2px solid #444;
            background: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, #333 75%, #222 75%), linear-gradient(-45deg, #333 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            overflow: hidden;
            flex: 3;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            min-width: 270px;
        }

        .info-box {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 4px solid #007acc;
            font-size: 14px;
        }

        #spritesheetSelect {
            width: 100%;
            padding: 8px;
            background: #1e1e1e;
            border: 1.5px solid #007acc;
            color: #fff;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        #spritesheetSelect:hover {
            border-color: #00aaff;
            background: #252525;
        }

        #searchInput {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #searchInput:focus {
            outline: none;
            border-color: #007acc;
        }

        #list {
            flex: 1;
            overflow-y: auto;
        }

        .sprite-item {
            padding: 8px 6px;
            margin: 4px 0;
            background: #3a3a3a;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: background 0.1s;
        }

        .sprite-item:hover,
        .sprite-item.active {
            background: #007acc;
            color: #fff;
        }

        h3 {
            margin-top: 0;
            color: #007acc;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #007acc;
        }
    </style>
</head>

<body>

    <h2>Antigravity - UI Atlas Interactive Inspector</h2>
    <div class="container">
        <div id="canvas-container">
            <canvas id="atlasCanvas"></canvas>
        </div>

        <div class="sidebar">
            <label for="spritesheetSelect">Active Spritesheet:</label>
            <select id="spritesheetSelect" onchange="changeSpritesheet(this.value)">
                <option value="ui">UI Atlas (UI.png)</option>
                <option value="items">Items Atlas (items.png)</option>
                <option value="vfx">VFX Atlas (vfx.png)</option>
                <option value="enemies">Enemies (enemies.png)</option>
                <option value="enemies2">Enemies 2 (enemies2.png)</option>
                <option value="enemies3">Enemies 3 (enemies3.png)</option>
                <option value="enemies2023">Enemies 2023 (enemies2023.png)</option>
                <option value="enemies2025">Enemies 2025 (enemies2025.png)</option>
                <option value="enemiesM">Enemies M (enemiesM.png)</option>
                <option value="stageEnemies">Stage Enemies Atlas (vs_enemies.png)</option>
                <option value="forestEnemies">Forest Enemies Atlas (vs_vfx.png)</option>
                <option value="illustrations">Illustrations Atlas (illustrations.png)</option>
                <option value="damageNumbers">Damage Numbers Atlas</option>
                <option value="stageIcons">Stage Icons Atlas (UI_StageIcons.png)</option>
            </select>

            <h3>Sprite Info</h3>
            <div class="info-box" id="info">Hover or click a sprite to inspect</div>

            <div style="margin-bottom: 10px; display: flex; gap: 5px; flex-wrap: wrap;">
                <button onclick="quickZoomUi('button_c5_normal')"
                    style="background:#007acc; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Button
                    C5 (Buy)</button>
                <button onclick="quickZoomUi('button_c8_normal')"
                    style="background:#444; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Button
                    C8 (Back)</button>
                <button onclick="quickZoomUi('button_c9_mouseover')"
                    style="background:#28a745; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Button
                    C9 (Refund)</button>
                <button onclick="quickZoomUi('frame1_c2')"
                    style="background:#17a2b8; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Frame
                    1 C2</button>
                <button onclick="quickZoomUi('frame5_c4')"
                    style="background:#17a2b8; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Frame
                    5 C4</button>
                <button onclick="quickZoomUi('frameD')"
                    style="background:#e83e8c; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12px;">Frame
                    D</button>
            </div>

            <input type="text" id="searchInput" placeholder="Search sprite..." autocomplete="off">
            <h3 id="sprite-list-header" style="margin-top: 10px;">Sprite List</h3>
            <div id="list"></div>
        </div>
    </div>

    <script>
        const SPRITESHEETS = {
            ui: {
                name: "UI Atlas",
                image: "assets/Graphics/Spritesheets/UI.png",
                json: "assets/Data/ui_atlas.json",
                isUnityCoords: true
            },
            items: {
                name: "Items Atlas",
                image: "assets/Graphics/Spritesheets/items.png",
                json: "assets/Data/items_atlas.json",
                isUnityCoords: true
            },
            vfx: {
                name: "VFX Atlas",
                image: "assets/Graphics/Spritesheets/vfx.png",
                json: "assets/Data/vfx_atlas.json",
                isUnityCoords: true
            },
            enemies: {
                name: "Enemies Atlas (enemies.png)",
                image: "assets/images/enemies/enemies.png",
                json: "assets/Data/enemies_atlas.json",
                isUnityCoords: true
            },
            enemies2: {
                name: "Enemies 2 Atlas (enemies2.png)",
                image: "assets/images/enemies/enemies2.png",
                json: "assets/Data/enemies2_atlas.json",
                isUnityCoords: true
            },
            enemies3: {
                name: "Enemies 3 Atlas (enemies3.png)",
                image: "assets/images/enemies/enemies3.png",
                json: "assets/Data/enemies3_atlas.json",
                isUnityCoords: true
            },
            enemies2023: {
                name: "Enemies 2023 Atlas (enemies2023.png)",
                image: "assets/images/enemies/enemies2023.png",
                json: "assets/Data/enemies2023_atlas.json",
                isUnityCoords: true
            },
            enemies2025: {
                name: "Enemies 2025 Atlas (enemies2025.png)",
                image: "assets/images/enemies/enemies2025.png",
                json: "assets/Data/enemies2025_atlas.json",
                isUnityCoords: true
            },
            enemiesM: {
                name: "Enemies M Atlas (enemiesM.png)",
                image: "assets/images/enemies/enemiesM.png",
                json: "assets/Data/enemiesM_atlas.json",
                isUnityCoords: true
            },
            stageEnemies: {
                name: "Stage Enemies Atlas",
                image: "assets/images/enemies/vs_enemies.png",
                json: "assets/Data/enemies/stage_enemies.json",
                isUnityCoords: false
            },
            forestEnemies: {
                name: "Forest Enemies Atlas",
                image: "assets/images/enemies/vs_vfx.png",
                json: "assets/Data/enemies/forest_enemies.json",
                isUnityCoords: false
            },
            illustrations: {
                name: "Illustrations Atlas",
                image: "assets/Graphics/Spritesheets/illustrations.png",
                json: "assets/Data/illustration_atlas.json",
                isUnityCoords: true
            },
            damageNumbers: {
                name: "Damage Numbers",
                image: "assets/Graphics/Spritesheets/UI.png",
                json: "assets/Data/damage_numbers_atlas.json",
                isUnityCoords: true
            },
            stageIcons: {
                name: "Stage Icons Atlas",
                image: "assets/Graphics/Spritesheets/UI_StageIcons.png",
                json: "assets/Data/StageIcons_atlas.json",
                isUnityCoords: true
            }
        };

        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('atlasCanvas');
        const ctx = canvas.getContext('2d');
        const searchInput = document.getElementById('searchInput');
        const listDiv = document.getElementById('list');
        const spritesheetSelect = document.getElementById('spritesheetSelect');

        let currentSheetKey = 'ui';
        let sprites = {};
        let img = new Image();
        let currentHighlightKey = null;

        // View Transform Variables
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        // Initial setup
        window.addEventListener('resize', resizeCanvas);
        loadSpritesheet(currentSheetKey);

        function changeSpritesheet(sheetKey) {
            if (sheetKey === currentSheetKey) return;
            loadSpritesheet(sheetKey);
        }

        function loadSpritesheet(sheetKey) {
            currentSheetKey = sheetKey;
            spritesheetSelect.value = sheetKey;
            const sheet = SPRITESHEETS[sheetKey];
            if (!sheet) return;

            document.getElementById('info').innerHTML = `Loading ${sheet.name}...`;

            fetch(sheet.json)
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.json();
                })
                .then(data => {
                    // Extract atlas if nested in enemy format
                    if (data.atlas) {
                        sprites = data.atlas;
                    } else {
                        sprites = data;
                    }
                    currentHighlightKey = null;
                    img = new Image();

                    img.onload = function () {
                        resizeCanvas();

                        // Center image initially
                        offsetX = (canvas.width - img.width) / 2;
                        offsetY = (canvas.height - img.height) / 2;
                        scale = 1;

                        document.getElementById('info').innerHTML = `Hover or click a sprite to inspect`;
                        drawEverything();
                        buildList();
                        applySearchFilter();
                    };

                    img.src = sheet.image;
                })
                .catch(err => {
                    alert(`Failed to load ${sheet.name} (${sheet.json})!`);
                    document.getElementById('info').innerHTML = `Error loading ${sheet.name}`;
                });
        }

        function quickZoomUi(spriteKey) {
            if (currentSheetKey !== 'ui') {
                spritesheetSelect.value = 'ui';
                currentSheetKey = 'ui';
                const sheet = SPRITESHEETS.ui;

                fetch(sheet.json)
                    .then(res => res.json())
                    .then(data => {
                        sprites = data;
                        currentHighlightKey = null;
                        img = new Image();
                        img.onload = function () {
                            resizeCanvas();
                            drawEverything();
                            buildList();
                            applySearchFilter();
                            zoomToSprite(spriteKey);
                        };
                        img.src = sheet.image;
                    });
            } else {
                zoomToSprite(spriteKey);
            }
        }

        function resizeCanvas() {
            canvas.width = canvasContainer.clientWidth;
            canvas.height = canvasContainer.clientHeight;
            drawEverything();
        }

        function getSpriteY(sp) {
            const sheet = SPRITESHEETS[currentSheetKey];
            if (sheet && sheet.isUnityCoords) {
                return img.height - sp.y - sp.height;
            }
            return sp.y;
        }

        function drawEverything() {
            if (!img.complete || img.width === 0) return;

            // Clear background
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Draw underlying image
            ctx.drawImage(img, 0, 0);

            // Draw bounding boxes
            for (let key in sprites) {
                const sp = sprites[key];
                const drawY = getSpriteY(sp);

                if (key === currentHighlightKey) {
                    // Blue highlight overlay
                    ctx.fillStyle = 'rgba(0, 122, 204, 0.4)';
                    ctx.fillRect(sp.x, drawY, sp.width, sp.height);

                    ctx.strokeStyle = '#00aaff';
                    ctx.lineWidth = 2 / scale;
                } else {
                    ctx.strokeStyle = 'rgba(0, 122, 204, 0.3)';
                    ctx.lineWidth = 1 / scale;
                }
                ctx.strokeRect(sp.x, drawY, sp.width, sp.height);
            }

            ctx.restore();
        }

        function buildList() {
            const keys = Object.keys(sprites).sort();
            const sheetName = SPRITESHEETS[currentSheetKey] ? SPRITESHEETS[currentSheetKey].name : 'Sprite';
            document.getElementById('sprite-list-header').innerText = `${sheetName} (${keys.length})`;

            listDiv.innerHTML = '';
            keys.forEach(key => {
                const div = document.createElement('div');
                div.className = 'sprite-item';
                div.innerText = key;
                div.id = `item-${key}`;

                div.onclick = () => zoomToSprite(key);
                div.onmouseenter = () => updateSelection(key, false);

                listDiv.appendChild(div);
            });
        }

        function updateSelection(key, scrollToList = true) {
            currentHighlightKey = key;
            if (!sprites[key]) {
                document.getElementById('info').innerHTML = `Hover or click a sprite to inspect`;
                drawEverything();
                return;
            }

            const sp = sprites[key];
            const drawY = getSpriteY(sp);
            document.getElementById('info').innerHTML = `
                <strong>Name:</strong> ${key}<br>
                <strong>Raw JSON (x, y):</strong> ${sp.x}, ${sp.y}<br>
                <strong>Canvas/SFML Y:</strong> ${drawY}<br>
                <strong>Size:</strong> ${sp.width} x ${sp.height}
            `;

            // Highlight in list
            document.querySelectorAll('.sprite-item').forEach(el => el.classList.remove('active'));
            const listItem = document.getElementById(`item-${key}`);
            if (listItem) {
                listItem.classList.add('active');
                if (scrollToList) {
                    listItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            drawEverything();
        }

        function zoomToSprite(key) {
            const sp = sprites[key];
            if (!sp) return;

            const drawY = getSpriteY(sp);
            const cx = sp.x + sp.width / 2;
            const cy = drawY + sp.height / 2;

            // Calculate ideal scale to fit sprite with padding
            const padding = 100;
            const scaleX = canvas.width / (sp.width + padding);
            const scaleY = canvas.height / (sp.height + padding);

            scale = Math.min(scaleX, scaleY);
            if (scale < 1) scale = 1;
            if (scale > 6) scale = 6;

            // Center camera on sprite
            offsetX = canvas.width / 2 - cx * scale;
            offsetY = canvas.height / 2 - cy * scale;

            updateSelection(key, true);
        }

        function applySearchFilter() {
            const q = searchInput.value.toLowerCase();
            const items = document.querySelectorAll('.sprite-item');
            items.forEach(item => {
                if (item.innerText.toLowerCase().includes(q)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // ==========================================
        // INPUT EVENTS: PAN, ZOOM, HOVER, SEARCH
        // ==========================================

        searchInput.addEventListener('input', applySearchFilter);

        // Mouse Wheel Zooming
        canvas.addEventListener('wheel', function (e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoomFactor = Math.exp(wheel * zoomIntensity);

            const worldX = (mouseX - offsetX) / scale;
            const worldY = (mouseY - offsetY) / scale;

            let newScale = scale * zoomFactor;
            if (newScale < 0.1) newScale = 0.1;
            if (newScale > 15) newScale = 15;

            offsetX = mouseX - worldX * newScale;
            offsetY = mouseY - worldY * newScale;
            scale = newScale;

            drawEverything();
        }, { passive: false });

        // Panning (Drag)
        canvasContainer.addEventListener('mousedown', function (e) {
            isDragging = true;
            dragStartX = e.clientX - offsetX;
            dragStartY = e.clientY - offsetY;
        });

        window.addEventListener('mouseup', function () {
            isDragging = false;
        });

        canvasContainer.addEventListener('mousemove', function (e) {
            if (isDragging) {
                offsetX = e.clientX - dragStartX;
                offsetY = e.clientY - dragStartY;
                drawEverything();
                return;
            }

            // Check hover intersections
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const worldX = (mouseX - offsetX) / scale;
            const worldY = (mouseY - offsetY) / scale;

            let found = null;
            for (let key in sprites) {
                const sp = sprites[key];
                const drawY = getSpriteY(sp);

                if (worldX >= sp.x && worldX <= sp.x + sp.width &&
                    worldY >= drawY && worldY <= drawY + sp.height) {
                    found = key;
                    break;
                }
            }

            if (found !== currentHighlightKey) {
                updateSelection(found, false);
            }
        });

        canvas.addEventListener('dragstart', e => e.preventDefault());
    </script>
</body>

</html>
